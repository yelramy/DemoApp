name: Bridge CI

on:
  push:
    branches: ["cursor/**", "master", "main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # version comes from package.json "packageManager" (pnpm@9.15.0)
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm --filter @bridge/db exec prisma generate
      - name: Prepare SQLite
        run: |
          # SQLite URLs resolve relative to schema.prisma; web needs an absolute path
          echo 'DATABASE_URL="file:./ci.db"' > packages/db/.env
          echo "DATABASE_URL=\"file:${GITHUB_WORKSPACE}/packages/db/prisma/ci.db\"" > apps/web/.env.local
          echo 'DEMO_OTP_CODE=246810' >> apps/web/.env.local
          echo 'WHISH_WEBHOOK_SECRET=dev-whish-secret' >> apps/web/.env.local
          cd packages/db && pnpm exec prisma db push && pnpm exec tsx prisma/seed.ts
      - run: pnpm --filter @bridge/web build
